<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>el portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #1b1b1b; /* main background */
        --panel-bg: #262626; /* panels for groups */
        --text: #ddddcc;
        --muted: #888870;
        --border: #3a3a3a;
        --accent-green: #7fbf7f; /* green online box */
        --accent-brown: #c2a15d;
	--accent-red: #c05b5b; /* red offline box */
     }

      body {
        margin: 0;
        font-family: "Fira Code", "Courier New", monospace;
        background: var(--bg);
        color: var(--text);
      }

      header {
        background: #202020;
        border-bottom: 2px solid var(--border);
        padding: 0.8rem 1rem;
      }

      header h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--accent-green);
      }

      main {
        max-width: 900px;
        margin: 1.2rem auto;
        padding: 0 1rem;
      }

      .quickview {
        background: var(--panel-bg);
        border: 1px solid var(--border);
        margin-bottom: 1.5rem;
        padding: 0.8rem 1rem;
      }

      .quickview h2 {
        color: var(--accent-brown);
        font-size: 1rem;
        margin: 0 0 0.6rem 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.3rem;
      }

      .quickview-services {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .quick-service {
        background: var(--highlight);
        border: 1px solid var(--border);
        color: var(--accent-green);
        padding: 0.25rem 0.5rem;
        font-size: 0.85rem;
        text-decoration: none;
      }

      .quick-service:hover {
        background: var(--border);
        color: var(--accent-brown);
      }

      .user-group {
        background: var(--panel-bg);
        border: 1px solid var(--border);
        margin-bottom: 1rem;
        padding: 0.6rem 1rem;
      }

      .user-group h2 {
        color: var(--accent-brown);
        font-size: 1.1rem;
        margin: 0 0 0.4rem 0;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.2rem;
      }

      .device {
        padding: 0.4rem 0;
        border-top: 1px solid var(--border);
      }

      .device:first-of-type {
        border-top: none;
      }

      .device-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .name {
        font-weight: bold;
        color: var(--accent-green);
        font-size: 0.95rem;
      }

      small {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: 1rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border: 1px solid var(--border);
      }

      .status-dot.online {
        background: var(--accent-green);
      }

      .status-dot.offline {
        background: var(--accent-red);
      }

      .services {
        margin-left: 1.2rem;
        margin-top: 0.4rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }

      .service {
        background: #1f1f1f;
        color: var(--accent-brown);
        border: 1px solid var(--border);
        padding: 0.15rem 0.35rem;
        font-size: 0.8rem;
        text-decoration: none;
      }

      .service:hover {
        background: #2e2e2e;
        color: var(--accent-green);
      }

      footer {
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 1rem;
        border-top: 1px solid var(--border);
        margin-top: 2rem;
      }

      @media (max-width: 600px) {
        .device-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .status {
          margin-top: 0.3rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>stuff and things</h1>
    </header>

    <main>
      <div class="quickview">
        <h2>quickview: active services</h2>
        <div class="quickview-services">
          <a href="#" class="quick-service">Jellyfin (maxp)</a>
          <a href="#" class="quick-service">Samba (maxp)</a>
          <a href="#" class="quick-service">Samba (vinx)</a>
          <a href="#" class="quick-service">MusicStreaming (vinx)</a>
          <a href="#" class="quick-service">BookLibrary (benp)</a>
        </div>
      </div>

      <div class="user-group">
        <h2>maxp</h2>
        <div class="device">
          <div class="device-header">
            <span class="name">desktop</span>
            <small>100.64.0.6 — linux</small>
            <div class="status">
              <div class="status-dot online"></div>
              <span>online</span>
            </div>
          </div>
          <div class="services">
            <a class="service" href="#">Plex</a>
            <a class="service" href="#">Samba</a>
          </div>
        </div>
        <div class="device">
          <div class="device-header">
            <span class="name">ancient</span>
            <small>100.64.0.14 — linux</small>
            <div class="status">
              <div class="status-dot offline"></div>
              <span>offline</span>
            </div>
          </div>
        </div>
      </div>

      <div class="user-group">
        <h2>vinx</h2>
        <div class="device">
          <div class="device-header">
            <span class="name">nix-server</span>
            <small>100.64.0.11 — linux</small>
            <div class="status">
              <div class="status-dot online"></div>
              <span>online</span>
            </div>
          </div>
          <div class="services">
            <a class="service" href="#">Jellyfin</a>
            <a class="service" href="#">something</a>
          </div>
        </div>
      </div>
    </main>

    <footer>🦀</footer>
  </body>
</html>
